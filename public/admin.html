<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Feedback</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛠️%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link href="/css/site.css" rel="stylesheet">
</head>
<body>

<!-- 1) Login screen (shown until you are logged in) -->
<section class="login" id="loginBox" hidden>
  <h1>Admin login</h1>
  <label class="field" for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" maxlength="200">
  <p class="msg" id="loginMsg" role="alert"></p>
  <button class="btn" id="loginBtn" type="button">Log in</button>
</section>

<!-- 2) Admin panel (shown after login) -->
<div class="admin-wrap" id="panel" hidden>
  <div class="admin-top">
    <span class="brand">Feedback admin</span>
    <div class="row">
      <span class="pill" id="counts">…</span>
      <a class="btn small ghost" href="/" target="_blank" rel="noopener">View public page</a>
      <button class="btn small ghost" id="backupBtn" type="button" title="Download all feedback as a .json file">Backup</button>
      <button class="btn small ghost" id="logoutBtn" type="button">Log out</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search title, text or name…" aria-label="Search feedback">
    <select id="filter" aria-label="Filter by status">
      <option value="all">All</option>
      <option value="published">Published</option>
      <option value="hidden">Hidden</option>
    </select>
  </div>

  <p class="status" id="status" role="status"></p>
  <!-- Feedback cards with Edit / Hide / Delete buttons are added here by js/admin.js -->
  <section class="admin-list" id="list"></section>
</div>

<script src="/js/admin.js" defer></script>
</body>
</html>
