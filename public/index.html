<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Feedback</title>
<meta name="description" content="What players say about the game.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link href="/css/site.css" rel="stylesheet">
</head>
<body>

<!-- Page header: game name, number of feedbacks, link to the game -->
<header class="hero">
  <h1 id="siteTitle">Limbo</h1>
  <p class="sub">Player Feedback</p>
  <div class="hero-actions">
    <span class="pill" id="count">Loading…</span>
    <a class="btn" id="playLink" href="#" hidden>▶ Play the game</a>
  </div>
</header>

<main>
  <!-- Star ratings summary (average, number of ratings and the 5-to-1 star bars) - filled in by js/feed.js -->
  <section class="rating-box" id="ratingBox" aria-label="Player ratings" hidden>
    <div class="rating-score">
      <div class="rating-big" id="ratingBig">0.0</div>
      <span class="stars" id="ratingStars" role="img"><span class="stars-bg">★★★★★</span><span class="stars-fg">★★★★★</span></span>
      <div class="rating-count" id="ratingCount"></div>
    </div>
    <ul class="rating-bars" id="ratingBars"></ul>
  </section>

  <!-- Shows "Loading…", errors or "No feedback yet" -->
  <p class="status" id="status" role="status">Loading feedback…</p>
  <!-- The feedback cards are added here by js/feed.js -->
  <section class="grid" id="list" aria-live="polite"></section>
  <div class="more"><button class="btn ghost" id="moreBtn" type="button" hidden>Load more</button></div>
</main>

<footer class="site">Feedback is written by players inside the game.</footer>

<script src="/js/feed.js" defer></script>
</body>
</html>
